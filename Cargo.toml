[package]
name = "diml"
version = "0.2.0"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "DIML parser"
documentation = "https://docs.rs/diml"
repository = "https://github.com/EngosSoftware/diml.git"
keywords = ["delimiter", "indented", "markup", "language", "parser"]
categories = ["encoding", "text-processing"]
rust-version = "1.88.0"
edition = "2024"
license = "MIT OR Apache-2.0"
include = [
    "src/**",
    "tests/**",
    "docs/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]
